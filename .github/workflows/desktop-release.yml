name: Cross-Platform Desktop Release

on:
  push:
    tags:
      - "v*"
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Codebase & Portability Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run Test Suite & Portability Matrix
        run: npm test

      - name: Verify Web Build
        run: npm run build

  build-desktop:
    name: Build ${{ matrix.os_name }}
    needs: validate
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            os_name: "Windows (x64 NSIS & Portable)"
            tauri_args: ""
            artifact_pattern: "src-tauri/target/release/bundle/nsis/*.exe"

          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
            os_name: "macOS (Apple Silicon arm64)"
            tauri_args: "--target aarch64-apple-darwin"
            artifact_pattern: "src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg"

          - platform: "macos-13"
            target: "x86_64-apple-darwin"
            os_name: "macOS (Intel x86_64)"
            tauri_args: "--target x86_64-apple-darwin"
            artifact_pattern: "src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg"

          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
            os_name: "Linux (AppImage & deb)"
            tauri_args: ""
            artifact_pattern: "src-tauri/target/release/bundle/appimage/*.AppImage"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Linux System Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file \
            libglib2.0-dev

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Frontend
        run: npm run build

      - name: Build Desktop Application (Tauri v2)
        run: npx tauri build ${{ matrix.tauri_args }}

      - name: Upload Binary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cadence-${{ matrix.target }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: warn

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: Generate Checksums (SHA-256)
        run: |
          cd dist-release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/*
          generate_release_notes: true
          draft: false
          prerelease: false
